<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BİSTDATA PORTFÖY TAKİP v20</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { 
            --primary: #2563eb; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; 
            --profit: #22c55e; --loss: #ef4444; --zero: #0ea5e9; --border: #334155;
        }

        body.light-mode {
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #cbd5e1;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; transition: background 0.3s; overflow-x: hidden; }
        .container { max-width: 1500px; margin: 0 auto; width: 100%; }
        
        /* HEADER - 3 KUTU EŞİT VE ORTALI */
        .header-panel { 
            display: grid; 
            grid-template-columns: 1fr 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        
        .brand, .s-card { 
            background: var(--card); 
            padding: 20px 10px; 
            border-radius: 12px; 
            text-align: center; 
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100px;
            box-sizing: border-box;
        }

        .brand h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; font-weight: 900; color: #3b82f6; }
        .brand p { margin: 5px 0 0; font-size: 9px; color: #60a5fa; font-weight: bold; }

        .s-card h4 { margin: 0; font-size: 10px; color: #94a3b8; }
        .s-val { font-size: 1.3rem; font-weight: bold; margin-top: 8px; }

        /* MODLAR VE TEMA - KAYDIRMA KALKTI, TAM GENİŞLİK */
        .modes-bar { 
            display: flex; 
            flex-wrap: wrap; /* Sığmazsa alt satıra geçer, kaydırma yapmaz */
            gap: 10px; 
            margin-bottom: 20px; 
            width: 100%;
        }
        .mode-tab { 
            flex: 1; /* Modlar genişliği paylaşır */
            min-width: 100px; 
            background: var(--card); 
            padding: 12px; 
            border-radius: 8px; 
            text-align: center;
            cursor: pointer; 
            border: 1px solid var(--border); 
            font-size: 12px;
        }
        .mode-tab.active { background: var(--primary); color: white; border-color: #60a5fa; }
        
        .theme-btn { 
            width: 100%; /* Mobilde tam genişlik */
            height: 45px; 
            background: var(--card); border: 1px solid var(--border); color: var(--text); 
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px;
            margin-top: 5px;
        }

        /* ANA IZGARA */
        .main-grid { display: grid; grid-template-columns: 320px 1fr 320px; gap: 20px; }
        .panel { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }

        .table-wrapper { overflow-x: auto; width: 100%; }
        table { width: 100%; border-collapse: collapse; min-width: 450px; }
        th { text-align: left; padding: 12px 8px; color: #94a3b8; font-size: 11px; border-bottom: 2px solid var(--border); }
        td { padding: 12px 8px; border-bottom: 1px solid var(--border); font-size: 13px; }
        
        /* MOBİL ÖZEL AYARLAR */
        @media (max-width: 900px) {
            .header-panel { 
                grid-template-columns: 1fr; /* 3 kutu alt alta tam genişlik */
                gap: 10px;
            }
            .main-grid { grid-template-columns: 1fr; }
            .brand { order: -1; } /* Logo en üstte */
            .mode-tab { flex: 1 1 45%; } /* Modlar yan yana ikişerli dizilir */
        }

        .text-profit { color: var(--profit) !important; font-weight: bold; }
        .text-loss { color: var(--loss) !important; font-weight: bold; }
        
        input, select, button { width: 100%; padding: 12px; margin-top: 8px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; box-sizing: border-box; }
    </style>
</head>
<body class="panel-row-tek">

<div class="container">
    <div class="header-panel">
        <div class="s-card"><h4>PORTFÖY DEĞERİ</h4><div id="totalVal" class="s-val">0</div></div>
        <div class="brand"><h1>BİSTDATA</h1><p>PORTFÖY TAKİP PROGRAMI</p></div>
        <div class="s-card"><h4>NET KÂR / ZARAR</h4><div id="totalPnl" class="s-val">0</div></div>
    </div>

    <div class="modes-bar" id="modesBar"></div>
    <button class="theme-btn" onclick="toggleTheme()" id="themeBtnText">Gündüz Modu</button>

    <div class="main-grid" style="margin-top:20px;">
        <div class="panel">
            <h3 style="font-size:14px; margin:0 0 15px 0;">İşlem Kaydı</h3>
            <input type="text" id="symbol" placeholder="HİSSE KODU" onkeyup="this.value=this.value.toUpperCase()">
            <select id="type"><option value="buy">ALIŞ (+)</option><option value="sell">SATIŞ (-)</option></select>
            <input type="number" id="lot" placeholder="LOT">
            <input type="number" id="price" step="0.01" placeholder="FİYAT">
            <button style="background:var(--primary); border:none; font-weight:bold; cursor:pointer; margin-top:15px;" onclick="addTransaction()">KAYDET</button>
        </div>

        <div class="panel">
            <h3 style="font-size:14px; margin:0 0 15px 0;">Portföy Detayı</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Hisse</th><th>Lot</th><th>Maliyet</th><th>Güncel</th><th>Tutar</th><th>K/Z</th></tr>
                    </thead>
                    <tbody id="portfolioBody"></tbody>
                </table>
            </div>
        </div>

        <div class="panel">
            <h3 style="font-size:14px; margin:0 0 15px 0;">Dağılım</h3>
            <div style="height:220px;"><canvas id="portfolioChart"></canvas></div>
        </div>
    </div>
</div>

<script>
let modes = JSON.parse(localStorage.getItem('bist_modes')) || [{ id: 'm1', name: 'Ana Portföy', data: [] }];
let activeModeId = localStorage.getItem('bist_active_mode') || 'm1';
let livePrices = {};
let myChart = null;
const MAX_MODES = 7;

const fmtInt = new Intl.NumberFormat('tr-TR', { maximumFractionDigits: 0 });
const fmtFloat = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function toggleTheme() {
    document.body.classList.toggle('light-mode');
    const isLight = document.body.classList.contains('light-mode');
    document.getElementById('themeBtnText').innerText = isLight ? 'Gece Modu' : 'Gündüz Modu';
    localStorage.setItem('bist_theme', isLight ? 'light' : 'dark');
}
if(localStorage.getItem('bist_theme') === 'light') toggleTheme();

function renderModes() {
    const bar = document.getElementById('modesBar');
    let html = modes.map(m => `
        <div class="mode-tab ${m.id === activeModeId ? 'active' : ''}" onclick="switchMode('${m.id}')">
            ${m.name}
        </div>
    `).join('');
    if(modes.length < MAX_MODES) {
        html += `<div class="mode-tab" onclick="addNewMode()" style="border:1px dashed #60a5fa; color:#60a5fa;">+ Yeni</div>`;
    }
    bar.innerHTML = html;
}

async function fetchPrices() {
    try {
        const res = await fetch('temelperformans.csv?v=' + Date.now());
        const text = await res.text();
        text.split(/\r?\n/).forEach((row, i) => {
            if(i === 0 || !row.trim()) return;
            const cols = row.trim().split(/\s{1,}|;|\t/);
            if(cols.length >= 2) {
                const sym = cols[0].trim().toUpperCase();
                livePrices[sym] = parseFloat(cols[1].replace(/\./g, '').replace(',', '.'));
            }
        });
        renderTable();
    } catch (e) {}
}

function renderTable() {
    const currentMode = modes.find(m => m.id === activeModeId);
    const summary = {};
    currentMode.data.forEach(t => {
        if(!summary[t.sym]) summary[t.sym] = { cost: 0, buyLot: 0, rev: 0, sellLot: 0 };
        if(t.type === 'buy') { summary[t.sym].cost += (t.lot * t.prc); summary[t.sym].buyLot += t.lot; }
        else { summary[t.sym].rev += (t.lot * t.prc); summary[t.sym].sellLot += t.lot; }
    });

    const body = document.getElementById('portfolioBody');
    body.innerHTML = '';
    let gVal = 0, gPnl = 0;
    let chartD = { labels: [], values: [] };

    for (const [sym, d] of Object.entries(summary)) {
        const remLot = d.buyLot - d.sellLot;
        const curP = livePrices[sym] || 0;
        const val = remLot * curP;
        const nPnl = (d.rev + val) - d.cost;
        if(remLot > 0) { gVal += val; chartD.labels.push(sym); chartD.values.push(val); }
        gPnl += nPnl;
        const breakEven = remLot > 0 ? (d.cost - d.rev) / remLot : 0;

        body.innerHTML += `
            <tr>
                <td><b>${sym}</b></td>
                <td>${fmtInt.format(remLot)}</td>
                <td>${fmtFloat.format(breakEven)}</td>
                <td style="color:#fbbf24;">${fmtFloat.format(curP)}</td>
                <td>${fmtInt.format(val)}</td>
                <td class="${nPnl >= 0 ? 'text-profit' : 'text-loss'}">${fmtInt.format(nPnl)}</td>
            </tr>`;
    }
    document.getElementById('totalVal').innerText = fmtInt.format(gVal) + " TL";
    document.getElementById('totalPnl').innerText = fmtInt.format(gPnl) + " TL";
    document.getElementById('totalPnl').className = 's-val ' + (gPnl >= 0 ? 'text-profit' : 'text-loss');
    updateChart(chartD);
}

function updateChart(data) {
    const ctx = document.getElementById('portfolioChart').getContext('2d');
    if(myChart) {
        myChart.data.labels = data.labels;
        myChart.data.datasets[0].data = data.values;
        myChart.update('none');
    } else {
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: data.labels, datasets: [{ data: data.values, backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'], borderWidth: 0 }] },
            options: { cutout: '70%', plugins: { legend: { display: false } }, maintainAspectRatio: false }
        });
    }
}

function addNewMode() { if(modes.length >= MAX_MODES) return; const name = prompt("Portföy Adı:"); if(!name) return; modes.push({ id: 'm'+Date.now(), name, data: [] }); saveAll(); renderModes(); }
function switchMode(id) { activeModeId = id; localStorage.setItem('bist_active_mode', id); renderModes(); renderTable(); }
function saveAll() { localStorage.setItem('bist_modes', JSON.stringify(modes)); }
function addTransaction() {
    const sym = document.getElementById('symbol').value.toUpperCase();
    const lot = parseFloat(document.getElementById('lot').value);
    const prc = parseFloat(document.getElementById('price').value);
    if(!sym || isNaN(lot)) return;
    modes.find(m => m.id === activeModeId).data.push({ id: Date.now(), sym, type: document.getElementById('type').value, lot, prc });
    saveAll(); renderTable();
}

renderModes();
setInterval(fetchPrices, 5000);
window.onload = fetchPrices;
</script>
</body>
</html>
